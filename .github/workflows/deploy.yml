name: Deploy til Simply.com

on:
  push:
    branches: [main]
  workflow_dispatch:
  # NYT: kører hver dag kl. 13.30 dansk sommertid (12.30 vintertid), når morgendagens elpriser er ude
  schedule:
    - cron: "30 11 * * *"

# Kun ét deploy ad gangen, så to pushes ikke uploader oven i hinanden
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      # NYT: skriver dagens elpriser ind i HTML'en, så Google og AI-søgemaskiner kan se dem.
      # Fejler hentningen, springer scriptet over, og siden uploades som normalt.
      - name: Hent dagens elpriser ind i siderne
        run: python3 tools/snapshot.py

      - name: Upload til Simply.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            README.md
            .env*
            **/.DS_Store
            tools/**
